name: static-build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fully static binary (Alpine/musl)
        run: |
          set -eu
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine:3.20 \
            sh -euc '
              apk add --no-cache build-base cmake linux-headers perl wget file \
                autoconf automake libtool binutils

              echo "== dependencies =="
              sh scripts/build.uv.sh
              sh scripts/build.hwloc.sh
              sh scripts/build.openssl3.sh

              echo "== configure =="
              cmake -S . -B build-ci \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_STATIC=ON \
                -DXMRIG_DEPS=/work/deps \
                -DWITH_OPENCL=OFF \
                -DWITH_CUDA=OFF \
                -DWITH_NVML=OFF \
                -DWITH_ADL=OFF

              echo "== build =="
              cmake --build build-ci --parallel "$(nproc)"

              echo "== verify =="
              BIN="$(ls build-ci/xmrig*)"
              file "$BIN" | tee /tmp/file.txt
              grep -q "statically linked" /tmp/file.txt || {
                echo "::error::binary is not statically linked"; exit 1; }

              if readelf -d "$BIN" | grep -q NEEDED; then
                echo "::error::binary has dynamic dependencies"; readelf -d "$BIN"; exit 1
              fi

              LDD="$(ldd "$BIN" 2>&1 || true)"
              echo "$LDD"
              case "$LDD" in
                *"not a dynamic executable"*|*"Not a valid dynamic program"*|*"statically linked"*) ;;
                *) echo "::error::ldd reports a dynamic binary"; exit 1 ;;
              esac

              "$BIN" --version
              echo "OK: fully static"

              echo "== package =="
              mkdir -p dist
              cp "$BIN" dist/arisk
              chmod 0755 dist/arisk
              tar -C dist -czf "arisk-linux-${{ matrix.arch }}.tar.gz" arisk
              chmod -R a+rX dist
              ls -l dist
            '

      - name: Fix artifact ownership
        run: |
          set -eu
          sudo chown -R "$(id -u):$(id -g)" dist build-ci deps
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisk-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
