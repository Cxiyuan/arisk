name: static-build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_ARGS: >-
    -DCMAKE_BUILD_TYPE=Release
    -DBUILD_STATIC=ON
    -DWITH_OPENCL=OFF
    -DWITH_CUDA=OFF
    -DWITH_NVML=OFF
    -DWITH_ADL=OFF

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: alpine:3.20
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          apk add --no-cache build-base cmake linux-headers perl wget file \
            autoconf automake libtool binutils

      - name: Build static dependencies (libuv, hwloc, OpenSSL)
        run: |
          sh scripts/build_deps.sh

      - name: Configure
        run: |
          cmake -S . -B build-ci $CMAKE_ARGS -DXMRIG_DEPS="$PWD/deps"

      - name: Build
        run: |
          cmake --build build-ci --parallel "$(nproc)"

      - name: Verify static linkage
        run: |
          set -eu
          BIN="$(ls build-ci/xmrig*)"
          file "$BIN"
          if readelf -d "$BIN" | grep -q 'NEEDED'; then
            echo "::error::binary has dynamic dependencies"
            readelf -d "$BIN"
            exit 1
          fi
          if ldd "$BIN" 2>&1 | grep -qi 'not a dynamic executable'; then
            echo "OK: fully static"
          else
            ldd "$BIN" || true
            echo "::error::binary is not static"
            exit 1
          fi
          "$BIN" --version

      - name: Package
        run: |
          set -eu
          mkdir -p dist
          cp "$(ls build-ci/xmrig*)" dist/arisk
          chmod +x dist/arisk
          tar -C dist -czf "arisk-linux-${{ matrix.arch }}.tar.gz" arisk
          ls -l dist dist/arisk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisk-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
